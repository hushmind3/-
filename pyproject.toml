[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockrl-distill"
version = "0.1.0"
description = "PyTorch time-series trading agent with teacher distillation and cost-aware PPO fine-tuning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "torch>=2.2", "psutil>=5.9", "requests>=2.31", "keyring>=25.6", "websockets>=12.0"]

[project.optional-dependencies]
teachers = ["stable-baselines3>=2.3", "sb3-contrib>=2.3", "gymnasium>=0.29", "scikit-learn>=1.2"]
desktop = ["PySide6>=6.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stockrl = ["web_dashboard.html"]
